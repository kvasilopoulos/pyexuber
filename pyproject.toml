[project]
name = "pyexuber"
version = "0.1.0"
description = "Recursive right-tailed unit root tests for explosive time series (Python bindings for exubercore)"
readme = "README.md"
authors = [
    { name = "Kostas Vasilopoulos", email = "k.vasilopoulo@gmail.com" }
]
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["econometrics", "unit-root", "bubbles", "explosive", "sadf", "gsadf", "time-series"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C++",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.22",
]

[project.urls]
Homepage = "https://exuber.kvasilopoulos.com/"
Repository = "https://github.com/kvasilopoulos/pyexuber"
Issues = "https://github.com/kvasilopoulos/pyexuber/issues"
Changelog = "https://github.com/kvasilopoulos/pyexuber/blob/main/CHANGELOG.md"

[project.optional-dependencies]
pandas = ["pandas>=1.4"]
polars = ["polars>=0.20"]

[dependency-groups]
dev = [
    "pandas>=1.4",
    "pytest>=8.0",
    "ruff>=0.8",
    "ty>=0.0.1a1",
]

[build-system]
requires = ["scikit-build-core>=0.11", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/exuber"]
cmake.source-dir = "."
# Dev-only files that have no business in the sdist (.gitignore'd paths
# are already excluded by default).
sdist.exclude = [".github/", ".claude/", "CLAUDE.md", "uv.lock", ".python-version"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty.environment]
python-version = "3.10"

[tool.pytest.ini_options]
markers = ["network: hits the live critical-value store (deselect with -m \"not network\")"]

# Wheel builds for PyPI (.github/workflows/release.yml). Each platform has
# to provide Armadillo (+ BLAS/LAPACK) before the build; the repair step
# (auditwheel/delocate/delvewheel) then bundles those shared libraries into
# the wheel so users need nothing but pip.
[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_* *_i686 *-win32 *_arm64_win"
build-verbosity = 1
test-requires = "pytest"
test-command = "pytest {project}/tests -m \"not network\""

[tool.cibuildwheel.linux]
archs = ["x86_64"]
manylinux-x86_64-image = "manylinux_2_28"
# EPEL carries armadillo for EL8; its lapack/openblas deps live in powertools.
before-all = [
  "dnf install -y epel-release dnf-plugins-core",
  "dnf config-manager --set-enabled powertools",
  "dnf install -y armadillo-devel",
]

[tool.cibuildwheel.macos]
before-all = "brew install armadillo"
# Homebrew's armadillo bottle is built for the runner's own macOS; delocate
# refuses to bundle a library newer than the wheel's target, so target the
# runner's OS (macos-15 / macos-15-intel in release.yml).
environment = { MACOSX_DEPLOYMENT_TARGET = "15.0" }

[tool.cibuildwheel.windows]
# Same explicit vcpkg wiring as ci.yml (the vcpkg toolchain file breaks
# pybind11's pip-side discovery). C:/vcpkg is GitHub's hosted-runner
# location, not configurable from here.
before-all = "vcpkg install armadillo --triplet x64-windows"
config-settings = { "cmake.define.ARMADILLO_INCLUDE_DIR" = "C:/vcpkg/installed/x64-windows/include", "cmake.define.ARMADILLO_LIBRARY" = "C:/vcpkg/installed/x64-windows/lib/armadillo.lib", "cmake.define.LAPACK_FOUND" = "TRUE", "cmake.define.LAPACK_LIBRARIES" = "C:/vcpkg/installed/x64-windows/lib/lapack.lib", "cmake.define.BLAS_FOUND" = "TRUE", "cmake.define.BLAS_LIBRARIES" = "C:/vcpkg/installed/x64-windows/lib/openblas.lib" }
before-build = "pip install delvewheel"
repair-wheel-command = "delvewheel repair -w {dest_dir} {wheel} --add-path C:/vcpkg/installed/x64-windows/bin"
