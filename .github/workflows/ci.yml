name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      # --no-install-project: only need numpy + dev tools resolvable for
      # ruff/ty, not the compiled extension (avoids building it here).
      - run: uv sync --no-install-project --dev
      - run: uv run --no-sync ruff check src/ tests/
      - run: uv run --no-sync ty check src/

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3

      - name: Install Armadillo (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarmadillo-dev

      - name: Install Armadillo (macOS)
        if: runner.os == 'macOS'
        run: brew install armadillo

      - name: Install Armadillo (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install armadillo --triplet x64-windows

      - name: Build + test (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          uv sync --dev
          uv run pytest

      - name: Build + test (Windows)
        if: runner.os == 'Windows'
        run: |
          $vcpkgDir = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows"
          # vcpkg's toolchain file intercepts find_package globally, which broke
          # discovery of pybind11 (a pip package, not a vcpkg one) -- pointing
          # CMake directly at vcpkg's Armadillo/LAPACK/BLAS files avoids it
          # entirely, same technique that worked for the local Rtools build.
          uv sync --dev `
            --config-setting=cmake.define.ARMADILLO_INCLUDE_DIR="$vcpkgDir/include" `
            --config-setting=cmake.define.ARMADILLO_LIBRARY="$vcpkgDir/lib/armadillo.lib" `
            --config-setting=cmake.define.LAPACK_FOUND=TRUE `
            --config-setting=cmake.define.LAPACK_LIBRARIES="$vcpkgDir/lib/lapack.lib" `
            --config-setting=cmake.define.BLAS_FOUND=TRUE `
            --config-setting=cmake.define.BLAS_LIBRARIES="$vcpkgDir/lib/openblas.lib"
          uv run pytest
