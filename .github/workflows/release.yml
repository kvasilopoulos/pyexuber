name: Release

# Builds sdist + wheels on every run; publishes only when triggered by a
# v* tag (to PyPI) or manually with target=testpypi. Trusted publishing
# (OIDC): no API token, but the PyPI/TestPyPI project must list this
# workflow as a publisher -- see RELEASING.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish (none = build only)"
        type: choice
        options: [none, testpypi]
        default: none

jobs:
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Tag must match pyproject version
        if: github.ref_type == 'tag'
        run: grep -qx "version = \"${GITHUB_REF_NAME#v}\"" pyproject.toml
      - run: uv build --sdist
      - run: pipx run twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  wheels:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pypa/cibuildwheel@v4.2.0
      - run: pipx run twine check --strict wheelhouse/*
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  publish:
    needs: [sdist, wheels]
    if: github.ref_type == 'tag' || inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_type == 'tag' && 'pypi' || 'testpypi' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ github.ref_type == 'tag' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
